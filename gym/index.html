<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Free offline gym app: personalised workout plans, animated exercise form guides, and Indian diet plans for the whole family.">
<meta name="theme-color" content="#0e1015">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardly Gym">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Cardly Gym">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<body>
<header class="top">

  <button id="who" class="who" data-act="who" aria-label="Switch profile"></button>

<nav id="nav" class="nav" aria-label="Main"></nav>
